name: mate101
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  
  # İkonlar
  cupertino_icons: ^1.0.8
  
  # Firebase ve Google Paketleri
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_analytics: ^11.3.0
  google_sign_in: ^6.2.1
  
  # İnternet işlemleri için
  http: ^1.2.2

  mailer: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# --- AYARLAR KISMI (Buraya dikkat) ---
flutter:
  uses-material-design: true

  # Asset dosyasını buraya, flutter'ın altına ekliyoruz:
  assets:
    - assets/universities.json